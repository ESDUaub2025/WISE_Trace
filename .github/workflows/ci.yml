name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: node --test scripts/media-backup.test.mjs
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: out/preview-tests
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase test db
      - run: node scripts/setup-local.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start local Edge functions
        run: npx supabase functions serve > /tmp/wise-functions.log 2>&1 &
      - run: node scripts/wait-for-functions.mjs
      - run: npm run test:api
      - run: node scripts/check-snapshot-concurrency.mjs
      - run: node scripts/check-reports.mjs
      - run: npm run test:live
      - run: node scripts/check-privacy.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-browser-test-results
          path: out/live-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: edge-runtime-logs
          path: /tmp/wise-functions.log
      - run: npx supabase stop
        if: always()
