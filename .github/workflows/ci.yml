name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: node --test scripts/media-backup.test.mjs
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: out/preview-tests
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: wise, POSTGRES_PASSWORD: wise-local-integration-only}
        ports: ["55579:5432"]
        options: --health-cmd "pg_isready -U postgres -d wise" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:server
      - run: node server/tests/snapshot-concurrency.mjs
      - run: docker build -f deploy/Postgres.test.Dockerfile -t wise-postgres-test .
      - run: docker run -d --name wise-rule-tests -e POSTGRES_DB=wise -e POSTGRES_PASSWORD=wise-local-integration-only -p 127.0.0.1:55580:5432 wise-postgres-test
      - run: until docker exec wise-rule-tests pg_isready -U postgres -d wise; do sleep 1; done
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Start local integration API
        run: node server/tests/serve.mjs > /tmp/wise-api.log 2>&1 &
      - run: for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3007/api/health && exit 0; sleep 1; done; exit 1
      - run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: live-test-results, path: out/live-tests}
