name: Encrypted nightly database and media backup
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Dump and encrypt without writing an unencrypted file
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$AGE_RECIPIENT"
          docker run --rm -e DATABASE_URL postgres:17 sh -c 'exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl' | age --recipient "$AGE_RECIPIENT" --output "wise-$(date -u +%F).dump.age"
      - name: Encrypt evidence and training bytes with integrity manifest
        run: node scripts/media-backup.mjs backup "wise-media-$(date -u +%F).age"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-recovery-${{ github.run_id }}
          path: '*.age'
          retention-days: 30
